name: Sync Broker Summary (Stockbit)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (tarik data tapi jangan tulis ke DB)"
        type: boolean
        default: false
      from:
        description: "Tanggal mulai (YYYY-MM-DD). Jika mau tarik 1 hari saja (misal saat retry gagal), isi ini saja"
        required: false
      to:
        description: "Tanggal akhir (YYYY-MM-DD). Jika dikosongkan, otomatis disamakan dengan 'from'"
        required: false
  schedule:
    # 12:00 UTC = 19:00 WIB (Senin - Jumat)
    - cron: "0 12 * * 1-5"
    # 16:00 UTC = 23:00 WIB (Senin - Jumat)
    - cron: "0 16 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync-broker-summary.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Opsional -- isi kalau endpoint di Pengaturan app.js beda dari default:
          # STOCKBIT_BROKER_ENDPOINT: ${{ secrets.STOCKBIT_BROKER_ENDPOINT }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then 
            ARGS="$ARGS --dry-run"
          fi

          FROM="${{ github.event.inputs.from }}"
          TO="${{ github.event.inputs.to }}"

          if [ -n "$FROM" ]; then
            # Jika 'to' kosong, gunakan tanggal 'from' (menarik 1 hari spesifik)
            if [ -z "$TO" ]; then
              TO="$FROM"
            fi
            ARGS="$ARGS --from=$FROM --to=$TO"
          fi

          node sync-broker-summary.mjs $ARGS
