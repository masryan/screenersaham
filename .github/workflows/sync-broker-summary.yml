name: Sync Broker Summary (Stockbit)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (tarik data tapi jangan tulis ke DB)"
        type: boolean
        default: true
      from:
        description: "Tanggal mulai (YYYY-MM-DD)"
        type: string
        required: false
      to:
        description: "Tanggal akhir (YYYY-MM-DD)"
        type: string
        required: false
  schedule:
    # 09:35 UTC = 16:35 WIB (Senin-Jumat)
    - cron: "35 9 * * 1-5"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync-broker-summary.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.from }}" ]; then ARGS="$ARGS --from=${{ inputs.from }} --to=${{ inputs.to }}"; fi
          node sync-broker-summary.mjs $ARGS
